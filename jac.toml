[project]
name = "pesashield"
version = "0.1.0"
description = "Pesa Shield - SMS scam guard agent in Jac"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[byllm.model]
default_model = "gpt-4o-mini"
api_key = "${OPENAI_API_KEY}"

[client]

# Public deploy: no bootstrap admin account (it would be admin/changeme), no
# Swagger, no built-in graph visualizer (it would expose the shared graph and
# shadows the app's /graph tab).
[scale.admin]
enabled = false

[serve]
docs_enabled = false
graph_enabled = false


[dependencies]

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]

[scripts]
# Run with `jac x test`: integration checks, dedupe check, regression check.
test = "jac test"
