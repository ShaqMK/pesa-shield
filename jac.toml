[project]
name = "pesashield"
version = "0.1.0"
description = "Pesa Shield - SMS scam guard agent in Jac"
entry-point = "main.jac"
kind = "fullstack"
jac-version = "==0.16.7"

[plugins.byllm.model]
default_model = "gpt-4o-mini"
api_key = "${OPENAI_API_KEY}"

[plugins.client]

[serve]
port = 3000
base_route_app = "app"

[dependencies]
jac-client = "==0.3.25"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[dev-dependencies]

[scripts]
test = "jac test -f endpoints*"
